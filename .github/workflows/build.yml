name: Build WASAPI FFmpeg (win64-gpl)

# Method B trigger only: this workflow has NO schedule. It runs either when you
# click "Run workflow" (workflow_dispatch) or when the upstream tracker in
# track-upstream.yml detects that BtbN/FFmpeg-Builds advanced and dispatches it.
on:
  workflow_dispatch:
    inputs:
      doRelease:
        description: "Publish a GitHub Release containing the built zip"
        type: boolean
        default: false

permissions:
  contents: write   # needed only for the optional Release step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Build win64-gpl with the WASAPI input device
        run: |
          bash ./build.sh win64 gpl > build.log 2>&1; rc=$?
          tail -n 250 build.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed (rc=$rc)"
            exit "$rc"
          fi

      - name: Show produced artifacts
        run: ls -lh artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-gpl-wasapi
          path: artifacts/*
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.doRelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wasapi-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" artifacts/* \
            --title "WASAPI FFmpeg $TAG" \
            --notes "Automated win64-gpl build with the custom WASAPI input device (libavdevice/wasapi_dec.c). Follows BtbN/FFmpeg-Builds upstream."
