name: Build WASAPI FFmpeg (Windows)

# Method B trigger only: this workflow has NO schedule.
# Builds both x64 (win64) and ARM64 (winarm64) Windows targets in parallel.

on:
  workflow_dispatch:
    inputs:
      doRelease:
        description: "Publish a GitHub Release containing the built zips"
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      REPO_OVERRIDE: btbn/ffmpeg-builds
    strategy:
      fail-fast: false
      matrix:
        target: [win64, winarm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build ${{ matrix.target }}-gpl with the WASAPI input device
        run: |
          bash ./build.sh ${{ matrix.target }} gpl > build.log 2>&1; rc=$?
          tail -n 250 build.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::build failed (rc=$rc)"
            exit "$rc"
          fi

      - name: Show produced artifacts
        run: ls -lh artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}-gpl-wasapi
          path: artifacts/*
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build.log
  release:
    name: Publish Release
    needs: build
    if: ${{ github.event.inputs.doRelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.run_number }}" all-artifacts/*/*.zip --title "WASAPI FFmpeg ${{ github.run_number }}" --notes "Automated Windows (x64 + ARM64) win64-gpl / winarm64-gpl builds with the custom WASAPI input device (libavdevice/wasapi_dec.c). Follows BtbN/FFmpeg-Builds upstream."
